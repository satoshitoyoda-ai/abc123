<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ABC 123">
<meta name="theme-color" content="#FFC93C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ABC 123</title>
<style>
  :root {
    --bg: #FFF6E5;
    --ink: #3B2A1A;
    --soft: #8A735C;
    --card: #FFFFFF;
    --accent: #FFC93C;       /* the child's favorite: sunny yellow */
    --accent-deep: #E0A800;
    --good: #3DBE7A;
    --hint: #8FD3FF;         /* hint glow is blue so it never looks like the main yellow */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation; }
  #app { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(64px, env(safe-area-inset-top)) 16px max(96px, env(safe-area-inset-bottom)); gap: 18px; text-align: center; }

  /* ---- Toshi ---- */
  .toshi { width: min(36vw, 190px); height: min(36vw, 190px); border-radius: 50%; overflow: hidden; flex: none;
    background: var(--accent); box-shadow: 0 6px 0 var(--accent-deep); animation: breathe 3s ease-in-out infinite; }
  .toshi.small { width: min(20vw, 100px); height: min(20vw, 100px); }
  .toshi img, .toshi svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tsvg .t-tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.1s ease-in-out infinite; }
  .tsvg .t-ear-l { transform-box: fill-box; transform-origin: 70% 10%; animation: earl 2.6s ease-in-out infinite; }
  .tsvg .t-ear-r { transform-box: fill-box; transform-origin: 30% 10%; animation: earr 2.6s ease-in-out infinite; }
  .tsvg .t-eyes  { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
  .tsvg .t-tongue{ transform-box: fill-box; transform-origin: 50% 0%; animation: pant 1.4s ease-in-out infinite; }
  .tsvg .t-head  { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .3s; }
  .toshi.excited .t-tail { animation-duration: .22s; }
  .toshi.excited .t-ear-l, .toshi.excited .t-ear-r { animation-duration: .35s; }
  .toshi.tilt .t-head { transform: rotate(-14deg); }
  .toshi.sleepy .t-eyes { animation: none; transform: scaleY(.12); }
  .toshi.sleepy .t-tail { animation-duration: 3s; }
  .toshi.jump   { animation: jump .8s cubic-bezier(.3,1.6,.5,1); }
  .toshi.spin   { animation: spin .9s ease-in-out; }
  .toshi.wiggle { animation: wiggle .7s ease-in-out; }
  .toshi.flip   { animation: flip .9s ease-in-out; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @keyframes wag { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(22deg); } }
  @keyframes earl { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
  @keyframes earr { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes pant { 50% { transform: scaleY(1.25); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1,1); } 15% { transform: translateY(0) scale(1.15,.85); }
    45% { transform: translateY(-50px) scale(.95,1.08); } 75% { transform: translateY(0) scale(1.1,.9); } 100% { transform: none; } }
  @keyframes spin { 30% { transform: translateY(-30px) rotate(0); } 70% { transform: translateY(-30px) rotate(360deg); } 100% { transform: rotate(360deg); } }
  @keyframes wiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(14deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(8deg); } }
  @keyframes flip { 50% { transform: translateY(-40px) scaleX(-1); } }
  .burst { position: fixed; pointer-events: none; font-size: 30px; z-index: 50; animation: burst 1s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; }
    to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; } }

  /* ---- shared ---- */
  .big-letter { font-size: min(36vw, 220px); line-height: 1; font-weight: 800; color: var(--ink);
    background: var(--accent); border-radius: 40px; padding: 10px 40px 18px; box-shadow: 0 8px 0 var(--accent-deep); }
  .boing { animation: boing .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.18,.85); } 60% { transform: scale(.92,1.1); } 100% { transform: scale(1); } }
  .word { font-size: min(8vw, 44px); font-weight: 700; }
  .word .ja { color: var(--soft); margin-left: .4em; }
  .emoji { font-size: min(18vw, 110px); line-height: 1; }
  .mini-toshi { width: min(24vw, 120px); height: min(24vw, 120px); }
  .row { display: flex; gap: min(4vw, 24px); justify-content: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 28px; background: var(--card); color: var(--ink); font: inherit; font-weight: 800;
    min-width: 96px; min-height: 96px; padding: 12px 20px; box-shadow: 0 6px 0 #E8D9C2; cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #E8D9C2; }
  .btn.go { background: var(--accent); color: var(--ink); box-shadow: 0 6px 0 var(--accent-deep); font-size: 44px; min-width: 140px; }
  .btn.choice { font-size: min(20vw, 110px); width: min(26vw, 170px); height: min(26vw, 170px); }
  .btn.good { background: var(--good); color: #fff; box-shadow: 0 6px 0 #2A9A5E; }
  .btn.glow { background: var(--hint); box-shadow: 0 0 0 8px rgba(143,211,255,.5), 0 6px 0 #5AA9DA; }
  .btn.dim { opacity: .35; }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .ear { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
    width: 76px; height: 76px; min-width: 0; min-height: 0; padding: 0; font-size: 38px; border-radius: 50%; z-index: 10; }
  .home { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    width: 64px; height: 64px; min-width: 0; min-height: 0; padding: 0; font-size: 32px; border-radius: 50%; z-index: 10; }
  .gear { position: fixed; right: 10px; top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; z-index: 10;
    background: transparent; border: 2px dashed #E3CFAF; color: #D9C4A3; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .gear.holding { background: #F3E3C8; }
  .say { font-size: min(6vw, 30px); font-weight: 700; color: var(--soft); min-height: 1.4em; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
  .confetti span { position: absolute; top: -40px; font-size: 34px; animation: fall 1.6s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

  /* ---- playground ---- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: 100%; max-width: 760px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .tile { border: none; border-radius: 26px; background: var(--card); box-shadow: 0 6px 0 #E8D9C2; padding: 14px 6px; font: inherit;
    font-weight: 800; font-size: 20px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 130px; justify-content: center; }
  .tile:active { transform: translateY(4px); box-shadow: 0 2px 0 #E8D9C2; }
  .tile .emoji { font-size: 54px; }
  .tile small { color: var(--soft); font-size: 15px; }
  .tile.yellow { background: var(--accent); box-shadow: 0 6px 0 var(--accent-deep); }

  /* ---- counting ---- */
  .apples { display: flex; flex-wrap: wrap; justify-content: center; gap: min(3vw, 18px); max-width: 720px; }
  .apple { font-size: min(14vw, 90px); width: min(20vw, 120px); height: min(20vw, 120px); display: flex; align-items: center; justify-content: center;
    border-radius: 24px; background: var(--card); box-shadow: 0 6px 0 #E8D9C2; position: relative; border: none; padding: 0; }
  .apple.counted { background: #FFF0B8; box-shadow: 0 6px 0 #F2D872; }
  .apple .tag { position: absolute; top: 4px; right: 10px; font-size: 26px; font-weight: 800; color: var(--ink); }
  .bowl { min-height: 120px; min-width: min(80vw, 420px); border-radius: 0 0 120px 120px; background: #FFE59A; box-shadow: inset 0 -10px 0 var(--accent-deep);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; padding: 10px 20px 24px; }
  .bone { font-size: min(11vw, 56px); background: none; border: none; padding: 4px; line-height: 1; }
  .pile { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 600px; }

  /* ---- walk ---- */
  .track-wrap { width: 100%; max-width: 900px; overflow-x: auto; padding: 60px 4px 10px; scroll-behavior: smooth; }
  .track { display: flex; gap: 4px; }
  .sq { flex: 1; min-width: 30px; aspect-ratio: 1; border-radius: 12px; background: var(--card); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: min(4.5vw, 30px); box-shadow: 0 4px 0 #E8D9C2; position: relative; }
  .track.long .sq { flex: none; width: 56px; font-size: 24px; }
  .sq.passed { background: #FFF0B8; }
  .sq.here { background: var(--accent); color: var(--ink); box-shadow: 0 4px 0 var(--accent-deep); }
  .sq .pin { position: absolute; bottom: 90%; width: 150%; aspect-ratio: 1; }
  .sq .pin svg { width: 100%; height: 100%; }
  .pin.hopping { animation: jump .45s ease; }
  .die-face { width: 70px; height: 70px; border-radius: 16px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px; gap: 2px; }
  .die-face i { border-radius: 50%; }
  .die-face i.on { background: var(--ink); }
  .rolling { animation: roll .5s ease; }
  @keyframes roll { 50% { transform: rotate(180deg) scale(1.2); } 100% { transform: rotate(360deg); } }

  /* ---- quick look ---- */
  .flash { width: min(60vw, 280px); height: min(60vw, 280px); border-radius: 30px; background: var(--card); box-shadow: 0 8px 0 #E8D9C2;
    display: grid; grid-template-columns: repeat(3, 1fr); padding: 28px; gap: 10px; }
  .flash i { border-radius: 50%; }
  .flash i.on { background: var(--ink); }
  .flash.hidden { background: var(--accent); box-shadow: 0 8px 0 var(--accent-deep); display: flex; align-items: center; justify-content: center; font-size: 110px; font-weight: 800; }

  /* ---- balloons ---- */
  .sky { position: relative; width: 100%; max-width: 900px; height: 62vh; overflow: hidden; border-radius: 30px; background: linear-gradient(#CDEBFF, #F2FAFF); }
  .balloon { position: absolute; bottom: -180px; width: min(22vw, 120px); height: min(26vw, 142px); border-radius: 50% 50% 46% 46%;
    display: flex; align-items: center; justify-content: center; font-size: min(12vw, 64px); font-weight: 800; color: var(--ink);
    border: none; animation: rise var(--dur) linear var(--delay) infinite; }
  .balloon::after { content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 50px; background: #9A8B7A; }
  .balloon.popped { visibility: hidden; }
  .balloon.wob { animation: rise var(--dur) linear var(--delay) infinite, shake .4s; }
  @keyframes rise { from { transform: translateY(0); } to { transform: translateY(calc(-62vh - 240px)); } }

  /* ---- tracing ---- */
  .trace-wrap { position: relative; touch-action: none; }
  #cv { touch-action: none; background: var(--card); border-radius: 30px; box-shadow: 0 8px 0 #E8D9C2; display: block; }

  /* ---- explorers ---- */
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 100%; max-width: 760px; }
  @media (min-width: 640px) { .keys { grid-template-columns: repeat(7, 1fr); } }
  .key { border: none; border-radius: 18px; background: var(--card); box-shadow: 0 5px 0 #E8D9C2; font: inherit; font-weight: 800;
    font-size: min(9vw, 48px); aspect-ratio: 1; color: var(--ink); padding: 0; }
  .key.seen { background: #FFF0B8; box-shadow: 0 5px 0 #F2D872; }
  .key:active { transform: translateY(3px); }
  .overlay { position: fixed; inset: 0; background: rgba(255,246,229,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 30; padding: 16px; }
  .frames { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .frame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #fff; padding: 10px; border-radius: 16px; box-shadow: 0 5px 0 #E8D9C2; }
  .frame i { width: min(9vw, 44px); height: min(9vw, 44px); border-radius: 50%; border: 3px dashed #E3CFAF; }
  .frame i.on { background: var(--accent); border: 3px solid var(--accent-deep); animation: boing .4s; }

  /* ---- parents ---- */
  .panel { background: var(--card); border-radius: 20px; padding: 20px; max-width: 560px; width: 100%; text-align: left; font-size: 17px; line-height: 1.5; }
  .panel h2 { margin: 0 0 8px; font-size: 22px; }
  .panel table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }
  .panel td { padding: 4px 6px; border-bottom: 1px solid #F0E6D6; }
  .panel .btn { min-height: 52px; min-width: 0; font-size: 17px; border-radius: 14px; margin: 4px 4px 0 0; box-shadow: 0 3px 0 #E8D9C2; background: #FFF3E2; }
  .panel .btn.on { background: var(--accent); }
  .muted { color: var(--soft); font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';

// ================= content =================
// [word, Japanese, emoji, spoken approximation of the letter sound]. Family recordings will replace the sounds later.
const WORDS = {
  A: ['apple', 'りんご', '🍎', 'aah'],   B: ['ball', 'ボール', '⚽', 'buh'],     C: ['cat', 'ねこ', '🐱', 'kuh'],
  D: ['dog', 'いぬ', 'TOSHI', 'duh'],    E: ['egg', 'たまご', '🥚', 'eh'],       F: ['fish', 'さかな', '🐟', 'fff'],
  G: ['grapes', 'ぶどう', '🍇', 'guh'],  H: ['hat', 'ぼうし', '👒', 'hah'],      I: ['iguana', 'イグアナ', '🦎', 'ih'],
  J: ['juice', 'ジュース', '🧃', 'juh'], K: ['key', 'かぎ', '🔑', 'kuh'],        L: ['lion', 'ライオン', '🦁', 'lll'],
  M: ['moon', 'つき', '🌙', 'mmm'],      N: ['nose', 'はな', '👃', 'nnn'],       O: ['octopus', 'たこ', '🐙', 'ah'],
  P: ['pig', 'ぶた', '🐷', 'puh'],       Q: ['queen', 'じょおう', '👸', 'kwuh'], R: ['rabbit', 'うさぎ', '🐰', 'rrr'],
  S: ['sun', 'たいよう', '☀️', 'sss'],   T: ['truck', 'トラック', '🚚', 'tuh'],  U: ['umbrella', 'かさ', '☂️', 'uh'],
  V: ['van', 'バン', '🚐', 'vvv'],       W: ['watermelon', 'すいか', '🍉', 'wuh'], X: ['fox', 'きつね', '🦊', 'ks'],
  Y: ['yo-yo', 'ヨーヨー', '🪀', 'yuh'], Z: ['zebra', 'しまうま', '🦓', 'zzz'],
};
// Lesson order (plan §4-3): the child's name letters first (built from the on-device name), then letters whose name holds their sound, then the rest.
const BASE_ORDER = 'BTPKMSDCFGHJLNORUVWZAEIQXY'.split('');
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const item = L => ({ L, en: WORDS[L][0], ja: WORDS[L][1], emoji: WORDS[L][2], snd: WORDS[L][3] });
const forLine = it => it.L === 'X' ? 'X is in fox!' : `${it.L} is for ${it.en}!${it.L === 'D' ? ' Like Toshi!' : ''}`;
const EN_NUM = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const JA_NUM = ['ぜろ','いち','に','さん','よん','ご','ろく','なな','はち','きゅう','じゅう',
  'じゅういち','じゅうに','じゅうさん','じゅうよん','じゅうご','じゅうろく','じゅうなな','じゅうはち','じゅうきゅう','にじゅう'];
const JA_KO  = ['','いっこ','にこ','さんこ','よんこ','ごこ','ろっこ','ななこ','はっこ','きゅうこ','じゅっこ'];
const JA_HON = ['','いっぽん','にほん','さんぼん','よんほん','ごほん','ろっぽん','ななほん','はっぽん','きゅうほん','じゅっぽん'];
const PRAISE = ['Wow, you found it!', 'Yes! You looked so carefully!', 'You did it!', 'Woo-hoo! You kept trying!', 'Awesome counting!', 'Yay! Great job thinking!'];
const PRAISE_JA = ['やったね！', 'すごい！', 'できたね！', 'よくみてたね！'];
const DICE = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const MASTERY_DAYS = 3;   // correct on 3 separate days = mastered

// ================= storage (on-device only) =================
const KEY = 'abc123-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const state = Object.assign({ letters: {}, numbers: {}, sessions: {}, secs: {}, lessonDone: {}, photo: null, name: '', limit: 20 }, load());
// The child's name lives only on the device (set in the parent panel) — never in the published code.
const kid = () => state.name || 'friend';
const buildOrder = () => { const own = [...new Set(state.name.toUpperCase().replace(/[^A-Z]/g, '').split(''))]; return [...own, ...BASE_ORDER.filter(L => !own.includes(L))]; };
let ORDER = buildOrder();
const today = () => new Date().toLocaleDateString('en-CA');
function rec(bucket, key) { return state[bucket][key] || (state[bucket][key] = { days: [], tries: 0, misses: 0 }); }
function markCorrect(bucket, key) { const r = rec(bucket, key); r.tries++; if (!r.days.includes(today())) r.days.push(today()); save(); }
function markMiss(bucket, key) { const r = rec(bucket, key); r.tries++; r.misses++; save(); }
const mastered = (bucket, key) => (state[bucket][key]?.days.length || 0) >= MASTERY_DAYS;
const knownLetters = () => { const s = ORDER.filter(L => state.letters[L]); return s.length >= 3 ? s : ORDER.slice(0, 5); };
const countMax = () => Object.keys(state.numbers).filter(k => k.startsWith('count') && mastered('numbers', k)).length >= 3 ? 8 : 5;
if ('storage' in navigator && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// Daily play-time cap (minutes, set in the parent panel). Counted only while the app is on screen.
let playing = false;
setInterval(() => { if (playing && document.visibilityState === 'visible') { state.secs[today()] = (state.secs[today()] || 0) + 5; save(); } }, 5000);
const overLimit = () => (state.secs[today()] || 0) >= state.limit * 60;

// ================= sound effects (Web Audio, no files) =================
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, t0, dur, type = 'sine', vol = 0.16, slideTo) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + t0, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093];
const sfx = {
  tap:   () => tone(700, 0, .07, 'triangle', .1),
  count: n => tone(SCALE[(n - 1) % SCALE.length], 0, .2, 'triangle', .18),
  yay:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .08, .25, 'triangle', .16)),
  pop:   () => { tone(1200, 0, .09, 'square', .07, 200); tone(300, .02, .12, 'sine', .12, 80); },
  soft:  () => tone(392, 0, .3, 'sine', .08, 330),              // gentle "hmm" — never a buzzer
  bark:  () => { tone(480, 0, .1, 'sawtooth', .1, 240); tone(540, .17, .1, 'sawtooth', .1, 260); },
  boing: () => tone(220, 0, .35, 'sine', .14, 660),
  whoosh:() => tone(200, 0, .3, 'triangle', .06, 900),
  snore: () => tone(140, 0, .8, 'sine', .08, 110),
};

// ================= speech: one language per utterance, lively =================
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang) {
  const re = lang === 'ja' ? /^ja[-_]/i : /^en[-_]US/i;
  const list = voices.filter(v => re.test(v.lang));
  return list.find(v => /Enhanced|Premium/i.test(v.name)) || list.find(v => /Kyoko|Samantha|Nicky|Google/.test(v.name)) || list[0] || null;
}
// Moods vary pitch and speed so the voice doesn't sound flat.
const MOODS = { normal: [1.0, 1.3], excited: [1.08, 1.6], slow: [0.8, 1.25], calm: [0.92, 1.15], sing: [0.95, 1.45] };
const wait = ms => new Promise(r => setTimeout(r, ms));
let gen = 0;   // bumped on every screen change so stale speech sequences stop
function say(text, lang = 'en', mood = 'normal', pitchAdd = 0) {
  const g = gen;
  const el = document.querySelector('.say'); if (el) el.textContent = text;
  return new Promise(resolve => {
    if (!('speechSynthesis' in window) || g !== gen) return resolve();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'ja' ? 'ja-JP' : 'en-US';
    const v = pickVoice(lang); if (v) u.voice = v;
    const [rate, pitch] = MOODS[mood] || MOODS.normal;
    u.rate = rate * (lang === 'ja' ? 1.05 : 0.92); u.pitch = Math.min(2, pitch + pitchAdd + (Math.random() * .1 - .05));
    let done = false; const fin = () => { if (!done) { done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1500 + text.length * 110);
    speechSynthesis.speak(u);
  });
}
async function seq(...lines) {
  const g = gen;
  for (const [text, lang, mood, p] of lines) { if (g !== gen) return false; await say(text, lang, mood, p); await wait(150); }
  return g === gen;
}

// ---- Toshi's walk: linear board, say each number while moving (Siegler & Ramani 2008) ----
function walk(goal, done) {
  let pos = 0, steps = 0, rolling = false;
  const dieFace = n => `<div class="die-face">${Array.from({ length: 9 }, (_, k) => `<i class="${(DICE[n] || []).includes(k) ? 'on' : ''}"></i>`).join('')}</div>`;
  const draw = hopping => {
    const sq = Array.from({ length: goal }, (_, i) => {
      const k = i + 1;
      return `<div class="sq ${k < pos ? 'passed' : ''} ${k === pos ? 'here' : ''}" data-k="${k}">${k === pos ? `<span class="pin ${hopping ? 'hopping' : ''}">${toshiSVG()}</span>` : ''}${k}</div>`;
    }).join('');
    render(`${pos === 0 ? toshi('small') : ''}<div class="track-wrap"><div class="track ${goal > 10 ? 'long' : ''}">${sq}</div></div><div class="say"></div>
      ${pos === goal ? '' : `<div class="row">
        <button class="btn" id="die" ${steps ? 'disabled style="opacity:.4"' : ''}>${steps ? dieFace(steps) : '<span style="font-size:52px">🎲</span>'}</button>
        <button class="btn go" id="step" ${steps ? '' : 'disabled style="opacity:.4"'}>🐾</button>
      </div>`}`, { ear: () => seq([steps ? 'Tap the paw to walk!' : 'Tap the dice!', 'en', 'excited']), home: !lesson });
    const here = app.querySelector('.sq.here'); if (here) here.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (pos === goal) return;
    $('#die').onclick = async () => {
      if (rolling || steps) return; rolling = true;
      $('#die').classList.add('rolling'); sfx.whoosh(); await wait(500);
      steps = Math.min(1 + rand(goal > 10 ? 3 : 2), goal - pos);   // small, countable moves
      draw(); await seq([`${EN_NUM[steps]}!`, 'en', 'excited']); rolling = false;
    };
    $('#step').onclick = async () => {
      if (!steps) return;
      pos++; steps = pos === goal ? 0 : steps - 1;
      draw(true); sfx.count(pos); await say(EN_NUM[pos] + '!', 'en', 'sing', pos * 0.03);
      if (pos === goal) {
        confetti(); sfx.yay(); markCorrect('numbers', 'walk' + goal); if (lesson) lesson.number = goal;
        const ok = await seq([`${EN_NUM[goal]}! Toshi made it home! You counted every step!`, 'en', 'excited'], [`${JA_NUM[goal]}！ゴール！`, 'ja', 'excited']);
        if (ok) setTimeout(done, 400);
      }
    };
  };
  draw();
  seq([`Let's walk Toshi to ${EN_NUM[goal]}! Say each number with me!`, 'en', 'excited']);
}

// ---- Quick look: see a dot pattern, say how many without counting ----
function quickLook(rounds, round = 0, last = 0) {
  let n = 1 + rand(5); if (n === last) n = n % 5 + 1;
  let misses = 0, finished = false;
  const dots = `<div class="flash" id="flash">${Array.from({ length: 9 }, (_, k) => `<i class="${DICE[n].includes(k) ? 'on' : ''}"></i>`).join('')}</div>`;
  const opts = shuffle([n, ...shuffle([1, 2, 3, 4, 5].filter(x => x !== n)).slice(0, 2)]);
  render(`<div id="slot">${dots}</div><div class="row">${opts.map(x => `<button class="btn choice" data-n="${x}">${x}</button>`).join('')}</div><div class="say"></div>`,
    { ear: () => show(), home: true });
  const show = async () => { if (!$('#slot')) return; $('#slot').innerHTML = dots; sfx.whoosh(); await wait(1500); if (!finished && $('#slot')) $('#slot').innerHTML = '<div class="flash hidden">?</div>'; };
  app.querySelectorAll('.choice').forEach(b => b.onclick = async () => {
    if (finished) return;
    if (+b.dataset.n === n) {
      finished = true; b.classList.add('good'); $('#slot').innerHTML = dots; sfx.yay(); confetti(); markCorrect('numbers', 'look' + n);
      const ok = await seq([`Yes! ${EN_NUM[n]}! Super eyes!`, 'en', 'excited'], [JA_NUM[n] + '！', 'ja', 'excited']);
      if (ok) setTimeout(() => round + 1 < rounds ? quickLook(rounds, round + 1, n) : playground(), 300);
    } else {
      misses++; b.classList.add('dim', 'shake'); sfx.soft(); markMiss('numbers', 'look' + n);
      await seq(["Let's look again!", 'en', 'calm']); show();
    }
  });
  seq(['Quick! Look!', 'en', 'excited']).then(show);
}

// ---- Balloon pop: pop the target letter ----
function balloons() {
  const pool = knownLetters(), target = pick(pool);
  const colors = ['#FFC93C', '#FF8FA3', '#8FD3FF', '#9BE59B', '#C9A7FF', '#FFB36B'];
  let hits = 0, done = false;
  const letterFor = () => Math.random() < 0.45 ? target : pick(ABC.filter(c => c !== target && !'BDPQ'.includes(c)));
  render(`<div class="word">🎈 ${target}<span class="ja">${WORDS[target][1]}</span></div><div class="sky" id="sky"></div><div class="say"></div>`,
    { ear: () => ask(), home: true });
  const sky = $('#sky');
  for (let i = 0; i < 6; i++) {
    const b = document.createElement('button'); b.className = 'balloon';
    b.style.left = (4 + i * 16) + '%'; b.style.background = colors[i % colors.length];
    b.style.setProperty('--dur', (9 + Math.random() * 5) + 's'); b.style.setProperty('--delay', (-Math.random() * 10) + 's');
    b.textContent = letterFor();
    b.addEventListener('pointerdown', async () => {
      if (done || b.classList.contains('popped')) return;
      if (b.textContent === target) {
        hits++; sfx.pop(); burst(b, ['✨', '⭐', '💛'], 8); b.classList.add('popped');
        setTimeout(() => { b.textContent = letterFor(); b.classList.remove('popped'); }, 1500);
        if (hits === 1) markCorrect('letters', target);
        if (hits >= 4) {
          done = true; confetti(); sfx.yay();
          const ok = await seq([`Pop pop pop! You found all the ${target}s!`, 'en', 'excited'], [pick(PRAISE_JA), 'ja', 'excited']);
          if (ok) setTimeout(playground, 300);
        } else { hush(); say(`${target}! ${pick(['Pop!', 'Yay!', 'Again!', 'Nice!'])}`, 'en', 'excited'); }
      } else {
        b.classList.remove('wob'); void b.offsetWidth; b.classList.add('wob'); sfx.soft();
        hush(); say(`That's ${b.textContent}.`, 'en', 'calm');
      }
    });
    sky.appendChild(b);
  }
  const ask = () => seq([`Pop the ${target} balloons!`, 'en', 'excited']);
  ask();
}

// ---- Write it: finger tracing with a generous check ----
function trace(count = 0, letters) {
  letters = letters || shuffle(knownLetters().slice()).slice(0, 2);
  const L = letters[count];
  if (!L) return playground();
  const size = Math.max(220, Math.round(Math.min(innerWidth - 32, innerHeight * 0.58, 520)));
  render(`<div class="say"></div><div class="trace-wrap"><canvas id="cv"></canvas></div>
    <div class="row"><button class="btn" id="clr" style="font-size:40px">🧽</button></div>`, { ear: () => ask(), home: true });
  const cv = $('#cv'), dpr = window.devicePixelRatio || 1;
  cv.width = cv.height = size * dpr; cv.style.width = cv.style.height = size + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const font = `800 ${Math.round(size * 0.78)}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  // Mask of the letter, used to judge coverage.
  const mask = document.createElement('canvas'); mask.width = mask.height = size;
  const mc = mask.getContext('2d'); mc.font = font; mc.textAlign = 'center'; mc.textBaseline = 'middle'; mc.fillText(L, size / 2, size * 0.54);
  const md = mc.getImageData(0, 0, size, size).data;
  const inLetter = (x, y) => x >= 0 && y >= 0 && x < size && y < size && md[(Math.round(y) * size + Math.round(x)) * 4 + 3] > 100;
  const step = Math.max(4, Math.round(size / 70)), targets = [];
  for (let y = 0; y < size; y += step) for (let x = 0; x < size; x += step) if (inLetter(x, y)) targets.push([x, y]);
  const lw = size * 0.1;
  const ink = document.createElement('canvas'); ink.width = ink.height = size; const ic = ink.getContext('2d');
  [ctx, ic].forEach(c => { c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = lw; });
  ctx.strokeStyle = '#1A1A1A'; ic.strokeStyle = '#000';
  const guide = () => { ctx.clearRect(0, 0, size, size); ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#FFE59A'; ctx.fillText(L, size / 2, size * 0.54); };
  guide();
  let drawing = false, last = null, pts = 0, outside = 0, lifts = 0, finished = false;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const near = (x, y) => { const d = lw * 0.7; return inLetter(x, y) || inLetter(x + d, y) || inLetter(x - d, y) || inLetter(x, y + d) || inLetter(x, y - d); };
  cv.addEventListener('pointerdown', e => { if (finished) return; drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); sfx.tap(); });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pos(e);
    [ctx, ic].forEach(c => { c.beginPath(); c.moveTo(...last); c.lineTo(...p); c.stroke(); });
    last = p; pts++; if (!near(...p)) outside++;
  });
  const up = async () => {
    if (!drawing) return; drawing = false; lifts++;
    const id = ic.getImageData(0, 0, size, size).data;
    const covered = targets.filter(([x, y]) => id[(y * size + x) * 4 + 3] > 0).length / targets.length;
    if (covered >= 0.6 && outside / Math.max(pts, 1) < 0.35) {
      finished = true; sfx.yay(); confetti(); markCorrect('letters', 'write' + L);
      const ok = await seq([`You wrote ${L}! ${pick(['Beautiful!', 'Wow!', 'Super writing!'])}`, 'en', 'excited'], [pick(PRAISE_JA), 'ja', 'excited']);
      if (ok) setTimeout(() => trace(count + 1, letters), 300);
    } else if (lifts % 3 === 0) {
      hush(); say(covered < 0.6 ? `Keep going! Color in all of ${L}!` : `Try to stay inside the ${L}!`, 'en', 'calm');
    }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  $('#clr').onclick = () => { sfx.whoosh(); guide(); ic.clearRect(0, 0, size, size); pts = outside = 0; };
  const ask = () => seq([`Let's write ${L}! Trace the yellow ${L} with your finger.`, 'en', 'excited']);
  ask();
}

// ---- ABC explorer: tap any letter ----
function abcExplorer() {
  render(`<div class="keys">${ABC.map(L => `<button class="key ${state.letters[L] ? 'seen' : ''}" data-l="${L}">${L}</button>`).join('')}</div><div class="say"></div>`,
    { home: true, ear: () => seq(['Tap a letter!', 'en', 'excited']) });
  app.querySelectorAll('.key').forEach(k => k.onclick = () => {
    const it = item(k.dataset.l); sfx.boing();
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="big-letter boing">${it.L}</div>${letterArt(it)}<div class="word">${it.en}<span class="ja">${it.ja}</span></div><div class="say"></div><div class="muted">tap to close / とじる</div>`;
    o.onclick = () => { hush(); sfx.whoosh(); o.remove(); };
    app.appendChild(o);
    hush(); seq([`${it.L}!`, 'en', 'excited'], [`${it.L} says ${it.snd}!`, 'en', 'slow'], [forLine(it), 'en', 'sing'], [it.ja, 'ja']);
  });
  seq(['Tap a letter!', 'en', 'excited']);
}

// ---- 123 explorer: tap a number, watch the ten-frames fill ----
function numExplorer() {
  render(`<div class="keys">${Array.from({ length: 20 }, (_, i) => `<button class="key" data-n="${i + 1}">${i + 1}</button>`).join('')}</div><div class="say"></div>`,
    { home: true, ear: () => seq(['Tap a number!', 'en', 'excited']) });
  app.querySelectorAll('.key').forEach(k => k.onclick = async () => {
    const n = +k.dataset.n; sfx.boing();
    const frames = n > 10 ? 2 : 1;
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = `<div class="big-letter boing">${n}</div><div class="frames">${Array.from({ length: frames }, (_, f) =>
      `<div class="frame">${Array.from({ length: 10 }, (_, c) => `<i data-c="${f * 10 + c + 1}"></i>`).join('')}</div>`).join('')}</div>
      <div class="word">${EN_NUM[n]}<span class="ja">${JA_NUM[n]}</span></div><div class="say"></div><div class="muted">tap to close / とじる</div>`;
    let open = true;
    o.onclick = () => { open = false; hush(); sfx.whoosh(); o.remove(); };
    app.appendChild(o);
    hush();
    for (let c = 1; c <= n && open; c++) { o.querySelector(`[data-c="${c}"]`).classList.add('on'); sfx.count(c); await wait(170); }
    if (!open) return;
    if (n > 10) seq([`Ten... and ${EN_NUM[n - 10]}... makes ${EN_NUM[n]}!`, 'en', 'sing'], [`じゅう と ${JA_NUM[n - 10]}で、${JA_NUM[n]}！`, 'ja', 'normal']);
    else seq([`${EN_NUM[n]}!`, 'en', 'excited'], [JA_NUM[n] + '！', 'ja', 'normal']);
  });
  seq(['Tap a number!', 'en', 'excited']);
}

// ================= parent gate: hold the gear for 2 seconds =================
function bindParentGate() {
  const g = $('#gear'); let t = null;
  const startHold = e => { e.preventDefault(); g.classList.add('holding'); t = setTimeout(parentPanel, 2000); };
  const endHold = () => { g.classList.remove('holding'); clearTimeout(t); };
  g.addEventListener('touchstart', startHold, { passive: false }); g.addEventListener('mousedown', startHold);
  ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => g.addEventListener(ev, endHold));
}
function parentPanel() {
  playing = false;
  const shown = ORDER.filter((L, i) => state.letters[L] || state.letters['write' + L] || i < 5);
  const rowsL = shown.map(L => {
    const r = state.letters[L], w = state.letters['write' + L]; const d = r?.days.length || 0;
    return `<tr><td><b>${L}</b></td><td>${d}/${MASTERY_DAYS} days ${d >= MASTERY_DAYS ? '✅' : ''}</td><td class="muted">${r ? `${r.misses} misses / ${r.tries} tries` : '—'}${w ? ' · wrote ✏️' : ''}</td></tr>`;
  }).join('');
  const rowsN = Object.entries(state.numbers).filter(([k]) => !k.startsWith('write')).sort().map(([k, r]) =>
    `<tr><td>${k}</td><td>${r.days.length} days ${r.days.length >= MASTERY_DAYS ? '✅' : ''}</td><td class="muted">${r.misses} misses / ${r.tries} tries</td></tr>`).join('') || '<tr><td class="muted">—</td></tr>';
  const last7 = Array.from({ length: 7 }, (_, i) => { const d = new Date(Date.now() - i * 864e5).toLocaleDateString('en-CA');
    return `${d.slice(5)}: ${Math.round((state.secs[d] || 0) / 60)} min${state.lessonDone[d] ? ' · lesson ✓' : ''}`; }).join('<br>');
  render(`<div class="panel">
    <h2>Parents / 保護者</h2>
    <b>Daily play limit</b> <span class="muted">(today: ${Math.round((state.secs[today()] || 0) / 60)} min)</span><div>
      ${[10, 20, 30, 45].map(m => `<button class="btn lim ${state.limit === m ? 'on' : ''}" data-m="${m}">${m} min</button>`).join('')}
      <button class="btn" id="plus">+10 min today</button></div><br>
    <b>Letters</b><table>${rowsL}</table>
    <b>Numbers</b><table>${rowsN}</table>
    <b>Last 7 days</b><div class="muted">${last7}</div><br>
    <b>Child's name</b><div><input id="kidname" value="${state.name.replace(/"/g, '&quot;')}" placeholder="name" style="font-size:18px;padding:8px;border-radius:10px;border:1px solid #E3CFAF"></div><br>
    <b>Toshi photo</b><div><input type="file" accept="image/*" id="photo"></div><br>
    <button class="btn" id="relesson">Redo today's lesson</button>
    <button class="btn" id="clearphoto">Use drawn Toshi</button>
    <button class="btn" id="reset">Reset progress</button>
    <button class="btn" id="back">Close</button>
    <p class="muted">All data stays on this device. Together-mode tip: ask "What else starts with ${(ORDER.find(L => !mastered('letters', L)) || 'D')}?"</p>
  </div>`);
  app.querySelectorAll('.lim').forEach(b => b.onclick = () => { state.limit = +b.dataset.m; save(); parentPanel(); });
  $('#plus').onclick = () => { state.secs[today()] = Math.max(0, (state.secs[today()] || 0) - 600); save(); parentPanel(); };
  $('#photo').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); const s = 320; c.width = c.height = s;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      state.photo = c.toDataURL('image/jpeg', 0.85); save(); parentPanel();
    }; img.src = URL.createObjectURL(f);
  };
  $('#kidname').onchange = e => { state.name = e.target.value.trim(); ORDER = buildOrder(); save(); };
  $('#relesson').onclick = () => { delete state.lessonDone[today()]; save(); startScreen(); };
  $('#clearphoto').onclick = () => { state.photo = null; save(); parentPanel(); };
  $('#reset').onclick = () => { if (confirm('Reset all progress?')) { Object.assign(state, { letters: {}, numbers: {}, sessions: {}, secs: {}, lessonDone: {} }); save(); parentPanel(); } };
  $('#back').onclick = startScreen;
}

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
startScreen();
